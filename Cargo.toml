[workspace]
resolver = "2"
members = [
    "crates/colibri-core",
    "crates/colibri-store",
    "crates/colibri-expert",
    "crates/colibri-quant",
    "crates/colibri-tok",
    "crates/colibri-engine-qwen",
    "crates/coli-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["zema-tech"]
repository = "https://github.com/zema-tech/colibri-rs"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
